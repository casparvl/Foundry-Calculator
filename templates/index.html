<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundry Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Configuration Error Message -->
        <div id="config-error-message" class="alert alert-danger d-none" role="alert">
            Failed to load configuration. Please refresh the page or check if the server is running.
        </div>
        
        <h1 class="mb-4">Foundry Calculator</h1>
        
        <!-- Configuration Panel -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Configuration</h5>
            </div>
            <div class="card-body">
                <!-- Desired Outputs -->
                <div class="mb-4">
                    <h6>Desired Outputs</h6>
                    <div id="outputs-container">
                        <!-- Dynamic output rows will be added here -->
                    </div>
                    <button class="btn btn-outline-primary btn-sm mt-2" onclick="addOutputRow()">
                        + Add Output
                    </button>
                </div>
                
                <!-- Global Settings -->
                <div class="accordion" id="settingsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#globalSettings">
                                Global Settings
                            </button>
                        </h2>
                        <div id="globalSettings" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
                            <div class="accordion-body">
                                <div id="global-settings-container">
                                    <!-- Dynamic global settings will be added here -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#recipeOverrides">
                                Recipe Overrides
                            </button>
                        </h2>
                        <div id="recipeOverrides" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
                            <div class="accordion-body">
                                <div id="recipe-overrides-container">
                                    <!-- Dynamic recipe overrides will be added here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-primary mt-3" onclick="calculate()">Calculate</button>
            </div>
        </div>
        
        <!-- Results Display -->
        <div id="results-section" style="display: none;">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Results</h5>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick="showTableView()">Table View</button>
                        <button class="btn btn-sm btn-outline-primary" onclick="showGraphView()">Graph View</button>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Table View -->
                    <div id="table-view">
                        <!-- Results table will be inserted here -->
                    </div>
                    
                    <!-- Graph View -->
                    <div id="graph-view" style="display: none;">
                        <div id="network" style="width: 100%; height: 1000px;"></div>
                    </div>
                </div>
            </div>
            
            <!-- Summary Panel -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Summary</h5>
                </div>
                <div class="card-body">
                    <div id="summary-content">
                        <!-- Summary information will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/vis-network/vis-network.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/calculator.js"></script>
    <script src="/static/js/graph.js"></script>
</body>
</html>
